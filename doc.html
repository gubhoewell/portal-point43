<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Point 43 — Documento</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#0a0a0a; color:#f0f0f0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2rem 1rem; }
  .box { background:#111; border:1px solid #1e1e1e; border-radius:18px; padding:28px 24px; width:100%; max-width:420px; text-align:center; }
  .box p { color:#777; font-size:14px; line-height:1.6; margin-bottom:16px; }
  .box a.volta { color:#c9a84c; font-size:14px; display:inline-block; margin-top:8px; }
  .login { display:flex; flex-direction:column; gap:10px; }
  .login input { background:#0a0a0a; border:1px solid #2a2a2a; border-radius:10px; padding:12px 14px; color:#f0f0f0; font-size:16px; }
  .login button { background:#c9a84c; color:#000; border:0; border-radius:10px; padding:12px; font-size:16px; font-weight:700; cursor:pointer; }
  .login-msg { color:#e07a5f; font-size:13px; min-height:16px; }
  .login-link { color:#777; font-size:13px; }
</style>
</head>
<body>
<div class="box" id="box"><p>Carregando…</p></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="central.js"></script>
<script>
const box = document.getElementById('box');
const id = new URLSearchParams(location.search).get('id') || '';
function msg(t) { box.innerHTML = '<p>' + t + '</p><a class="volta" href="index.html">← Central de Sistemas</a>'; }
async function abrir() {
  try {
    const s = await FS.collection('docs_html').doc(id).get();
    if (!s.exists) return msg('Documento não encontrado.');
    const html = s.data().html;
    document.open(); document.write(html); document.close();
  } catch (e) { msg('Você não tem acesso a este documento.'); }
}
AUTH.onAuthStateChanged(u => {
  if (!id) return msg('Documento não informado.');
  if (u) return abrir();
  box.innerHTML = '<p>Entre para abrir o documento.</p>';
  box.appendChild(formLogin(() => {}));
});
</script>
</body>
</html>
